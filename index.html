<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="카테고리, 진행률, 드래그 정렬을 지원하는 반응형 할 일 관리 앱" />
  <title>My Tasks</title>
  <script>
    // CSS 적용 전에 테마를 정해서 새로고침 시 화면 깜빡임(FOUC) 방지.
    // 키 이름('theme')은 script.js의 THEME_KEY와 같아야 함.
    (function () {
      var theme = null;
      try { theme = localStorage.getItem('theme'); } catch (e) { /* 저장소 차단 환경 */ }
      if (theme !== 'dark' && theme !== 'light') {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!--
    반응형 레이아웃 (자세한 기준은 style.css 상단 주석 참고)
      - 데스크톱(1024px 이상): 왼쪽 사이드바(요약·필터) + 오른쪽 메인(입력·목록)이 화면 전체를 채움
      - 태블릿/모바일: 사이드바와 메인이 위아래로 쌓이는 한 장의 카드
    script.js는 요소를 id로 찾으므로, 구조를 바꿔도 id는 유지할 것.
  -->
  <div class="app">
    <aside class="sidebar" aria-label="요약 및 필터">
      <!-- 헤더: 제목 + 남은 개수 배지 + 테마 토글 -->
      <header class="app__header">
        <h1 class="app__title">
          My Tasks
          <span class="badge" id="remaining-badge" title="남은 할 일">0</span>
          <span class="sr-only">개 남음</span>
        </h1>
        <button
          type="button"
          class="theme-toggle"
          id="theme-toggle"
          role="switch"
          aria-checked="false"
          aria-label="다크 모드"
          aria-keyshortcuts="Alt+D"
          title="다크 모드 (Alt+D)"
        >
          <span class="theme-toggle__track"><span class="theme-toggle__thumb"></span></span>
        </button>
      </header>

      <!-- 오늘의 격언 -->
      <section class="quote" aria-labelledby="quote-label">
        <div class="quote__content">
          <p class="quote__label" id="quote-label">오늘의 격언</p>
          <blockquote class="quote__text" id="quote-text"></blockquote>
          <p class="quote__author">— <cite id="quote-author"></cite></p>
        </div>
        <button type="button" class="icon-btn quote__refresh" id="quote-refresh" aria-label="다른 격언 보기" title="다른 격언 보기">↻</button>
      </section>

      <!-- 진행률 대시보드 -->
      <section class="stats" aria-label="진행률 대시보드">
        <div class="stats__header">
          <span class="stats__label">전체 진행률</span>
          <span class="stats__summary" id="stats-summary">0/0 완료 (0%)</span>
        </div>
        <div
          class="progress"
          id="stats-progress"
          role="progressbar"
          aria-label="전체 진행률"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <div class="progress__bar" id="stats-bar"></div>
        </div>
        <p class="stats__cheer" id="stats-cheer"></p>

        <div class="stats__categories">
          <div class="stat-cat" data-category="work">
            <div class="stat-cat__top">
              <span class="stat-cat__name">업무</span>
              <span class="stat-cat__count">0/0</span>
            </div>
            <div class="progress progress--mini" aria-hidden="true"><div class="progress__bar"></div></div>
          </div>
          <div class="stat-cat" data-category="personal">
            <div class="stat-cat__top">
              <span class="stat-cat__name">개인</span>
              <span class="stat-cat__count">0/0</span>
            </div>
            <div class="progress progress--mini" aria-hidden="true"><div class="progress__bar"></div></div>
          </div>
          <div class="stat-cat" data-category="study">
            <div class="stat-cat__top">
              <span class="stat-cat__name">공부</span>
              <span class="stat-cat__count">0/0</span>
            </div>
            <div class="progress progress--mini" aria-hidden="true"><div class="progress__bar"></div></div>
          </div>
        </div>

        <p class="stats__today">오늘 추가된 할 일 <strong id="stats-today">0</strong>개</p>
      </section>

      <!-- 카테고리 필터 (데스크톱에서는 세로 메뉴) -->
      <div class="sidebar__section">
        <h2 class="sidebar__heading" id="filters-heading">카테고리</h2>
        <nav class="filters" id="filters" aria-labelledby="filters-heading">
          <button type="button" class="filter-btn" data-filter="all" aria-pressed="false" aria-keyshortcuts="Alt+1" title="Alt+1">전체</button>
          <button type="button" class="filter-btn" data-filter="work" data-category="work" aria-pressed="false" aria-keyshortcuts="Alt+2" title="Alt+2">업무</button>
          <button type="button" class="filter-btn" data-filter="personal" data-category="personal" aria-pressed="false" aria-keyshortcuts="Alt+3" title="Alt+3">개인</button>
          <button type="button" class="filter-btn" data-filter="study" data-category="study" aria-pressed="false" aria-keyshortcuts="Alt+4" title="Alt+4">공부</button>
        </nav>
      </div>
    </aside>

    <main class="main">
      <!-- 검색 / 정렬 / 일괄 삭제 (데스크톱에서는 상단 고정 바) -->
      <div class="toolbar">
        <div class="search">
          <svg class="search__icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2" />
            <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
          <input
            type="search"
            id="search-input"
            class="search__input"
            placeholder="할 일 검색 ( / )"
            aria-label="할 일 검색"
            aria-controls="todo-list"
            aria-keyshortcuts="/"
            maxlength="200"
          />
        </div>
        <select id="sort-select" class="sort-select" aria-label="정렬 방식" title="정렬 방식">
          <option value="status">완료 상태순</option>
          <option value="manual">직접 정렬</option>
          <option value="created">생성일순 (최신)</option>
          <option value="category">카테고리순</option>
        </select>
        <button type="button" class="clear-btn" id="clear-completed" disabled>완료 항목 삭제</button>
      </div>

      <!-- 새 할 일 입력 -->
      <section class="composer" aria-label="새 할 일 추가">
        <form class="todo-form" id="todo-form" autocomplete="off" novalidate>
          <select id="todo-category" class="todo-form__select" aria-label="새 할 일의 카테고리">
            <option value="work">업무</option>
            <option value="personal">개인</option>
            <option value="study">공부</option>
          </select>
          <input
            type="text"
            id="todo-input"
            class="todo-form__input"
            placeholder="할 일을 입력하세요 (Alt+N)"
            aria-label="새 할 일"
            aria-describedby="category-hint dup-hint"
            aria-keyshortcuts="Alt+N"
            maxlength="200"
          />
          <button type="submit" class="todo-form__button">추가</button>
        </form>

        <!-- 키워드 자동 분류: 켜기/끄기 + 분류 결과 안내 -->
        <div class="form-meta">
          <label class="auto-toggle" title="입력한 내용의 키워드로 카테고리를 자동 선택합니다">
            <input type="checkbox" id="auto-category" checked />
            키워드 자동 분류
          </label>
          <p class="category-hint" id="category-hint" aria-live="polite" hidden></p>
        </div>
        <p class="dup-hint" id="dup-hint" hidden></p>
      </section>

      <!-- 할 일 목록 -->
      <p class="sr-only" id="list-help">
        할 일 텍스트를 더블클릭하거나 수정 버튼을 눌러 편집합니다.
        순서 변경 핸들에 포커스한 뒤 위·아래 화살표 키로 순서를 바꿀 수 있습니다.
      </p>
      <ul class="todo-list" id="todo-list" aria-label="할 일 목록" aria-describedby="list-help"></ul>
      <div class="todo-empty" id="todo-empty" hidden>
        <span class="todo-empty__icon" id="todo-empty-icon" aria-hidden="true">📝</span>
        <p class="todo-empty__text" id="todo-empty-text"></p>
      </div>

      <!-- 데이터 내보내기 / 가져오기 + 단축키 안내 -->
      <div class="main__footer">
        <section class="data-actions" aria-label="데이터 관리">
          <button type="button" class="btn btn--ghost btn--sm" id="export-btn">⬇ JSON 내보내기</button>
          <button type="button" class="btn btn--ghost btn--sm" id="import-btn">⬆ JSON 가져오기</button>
          <input type="file" id="import-file" accept=".json,application/json" hidden />
        </section>

        <footer class="shortcuts" aria-label="키보드 단축키">
          <span><kbd>Alt</kbd>+<kbd>N</kbd> 새 할 일</span>
          <span><kbd>Alt</kbd>+<kbd>1</kbd>~<kbd>4</kbd> 필터</span>
          <span><kbd>Alt</kbd>+<kbd>D</kbd> 테마</span>
          <span><kbd>/</kbd> 검색</span>
          <span><kbd>Ctrl</kbd>+<kbd>Z</kbd> 삭제 취소</span>
          <span>⋮⋮ 드래그로 순서 변경</span>
        </footer>
      </div>
    </main>
  </div>

  <!-- 범용 확인 다이얼로그 (script.js의 openDialog가 내용을 채움) -->
  <dialog class="dialog" id="app-dialog" aria-labelledby="dialog-title" aria-describedby="dialog-message">
    <form method="dialog" class="dialog__body">
      <h2 class="dialog__title" id="dialog-title"></h2>
      <p class="dialog__message" id="dialog-message"></p>
      <div class="dialog__extra" id="dialog-extra" hidden></div>
      <div class="dialog__actions" id="dialog-actions"></div>
    </form>
  </dialog>

  <!-- 토스트 알림 (화면 + 스크린 리더) -->
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <!-- 화면에는 보이지 않고 스크린 리더에만 읽히는 안내 -->
  <div class="sr-only" id="sr-announcer" aria-live="polite" aria-atomic="true"></div>

  <script src="script.js"></script>
</body>
</html>
